name: Publish review preview
on:
  push:
    branches: [main]
    paths: ['preview/**', '.github/workflows/pages.yml', 'scripts/check-preview.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
